name: Website bug
description: Report a reproducible problem with the public website.
title: "bug: "
labels:
  - "status: proposed"
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, personal data, or vulnerability details."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page
      description: Provide the public URL or page name.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and device
      description: Include the browser, operating system, and device or viewport when relevant.
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Describe any keyboard, screen reader, contrast, motion, or readability impact.
