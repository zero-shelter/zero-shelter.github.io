name: Website change
description: Propose a scoped content, design, accessibility, or deployment change.
title: "site: "
labels:
  - "status: proposed"
  - "type: change"
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, personal data, internal URLs, or vulnerability details."
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What visitor or maintainer outcome should this change produce?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Change area
      options:
        - Content
        - Design
        - Accessibility
        - Performance
        - Search and metadata
        - Deployment
        - Maintenance
        - Other
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the affected pages and describe what is included and excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Include accessibility, responsive layout, link, and deployment checks as applicable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I confirmed that this Issue contains no secrets or sensitive internal details.
          required: true
